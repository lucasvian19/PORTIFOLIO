.grad{background:linear-gradient(90deg,#ec4899,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}

.vid small{position:absolute;left:18px;bottom:16px;font-size:13px}
.play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.35);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:22px}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:50;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08);font-size:18px}
.row{display:flex;gap:16px;width:max-content;margin-bottom:16px;animation:mv 40s linear infinite}
.row.r{animation-direction:reverse;animation-duration:50s}
.mask{overflow:hidden}
.tile{width:320px;height:180px;border-radius:20px;border:1px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600}
@keyframes mv{to{transform:translateX(-50%)}}
.faq{max-width:620px;margin:auto}
.q{border-bottom:1px solid var(--line)}

var $=function(i){return document.getElementById(i)};
var lang="pt";try{lang=localStorage.getItem("lang")||(navigator.language||"").toLowerCase().indexOf("pt")==0?"pt":"en";var sv=localStorage.getItem("lang");if(sv)lang=sv}catch(e){}
function type(el,txt,sp,done){var i=0;(function s(){el.textContent=txt.slice(0,++i);if(i<txt.length)setTimeout(s,sp);else if(done)done()})()}
var typed=false;
function apply(){var D=T[lang];document.documentElement.lang=lang=="pt"?"pt-BR":"en";document.title="Lucas Viana | "+D.role;
document.querySelectorAll("[data-i]").forEach(function(e){e.innerHTML=D[e.getAttribute("data-i")]});

var G=["#f9a8d4,#a5b4fc","#fde68a,#fb923c","#86efac,#22d3ee","#c4b5fd,#f472b6","#fca5a5,#fcd34d","#93c5fd,#a78bfa","#a7f3d0,#60a5fa","#fdba74,#f87171"];

function setMode(m){mode=m;cur=0;$("mv").className=m=="v"?"on":"";$("mh").className=m=="h"?"on":"";render()}
